<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlphaBase FC</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: #050505;
            margin: 0; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: -apple-system, sans-serif; color: white;
        }

        /* Branding */
        .logo-box {
            width: 90px; height: 90px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            color: #0A84FF; margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .title { font-weight: 800; font-size: 26px; letter-spacing: -0.5px; margin-bottom: 10px; }
        .status { font-size: 12px; opacity: 0.4; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; }

        /* Progress Bar Container */
        .loader-track {
            width: 200px; height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px; overflow: hidden;
            position: relative;
        }

        /* The Moving Bar */
        .loader-fill {
            position: absolute; top: 0; left: 0;
            width: 0%; height: 100%;
            background: #0A84FF;
            box-shadow: 0 0 15px #0A84FF;
            transition: width 0.4s ease; /* Smooth glide */
        }
    </style>
</head>
<body>

    <div class="logo-box">
        <i data-lucide="shield-check" size="48"></i>
    </div>

    <div class="title">ALPHABASE</div>
    <div class="status" id="status-text">Initializing Systems</div>

    <div class="loader-track">
        <div class="loader-fill" id="progress-bar"></div>
    </div>

    <script>
        lucide.createIcons();

        const bar = document.getElementById('progress-bar');
        const status = document.getElementById('status-text');

        // Logic to simulate real resource loading
        function startBoot() {
            let progress = 0;
            
            // 1. Start Initializing
            setTimeout(() => {
                progress = 30;
                bar.style.width = progress + "%";
                status.innerText = "Syncing Assets";
            }, 500);

            // 2. Service Worker Check
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then(() => {
                    setTimeout(() => {
                        progress = 70;
                        bar.style.width = progress + "%";
                        status.innerText = "Optimizing Database";
                        
                        // 3. Final Leap
                        setTimeout(() => {
                            progress = 100;
                            bar.style.width = progress + "%";
                            status.innerText = "Welcome Coach";
                            
                            // Finish & Redirect
                            setTimeout(() => {
                                window.location.href = 'home.html';
                            }, 800);
                        }, 1000);
                    }, 1000);
                });
            } else {
                // Fallback for non-PWA browsers
                bar.style.width = "100%";
                setTimeout(() => { window.location.href = 'home.html'; }, 1000);
            }
        }

        window.onload = startBoot;
    </script>
</body>
</html>

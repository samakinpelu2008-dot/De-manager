<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlphaBase FC</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: #050505;
            margin: 0; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: -apple-system, sans-serif; color: white;
            overflow: hidden;
        }

        .loader {
            width: 80px; height: 80px; border-radius: 22px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            color: #0A84FF; box-shadow: 0 0 30px rgba(10, 132, 255, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Update Prompt Style */
        #update-toast {
            position: fixed; bottom: 30px;
            background: #0A84FF; color: white;
            padding: 15px 25px; border-radius: 50px;
            font-weight: 700; display: none;
            box-shadow: 0 10px 30px rgba(10, 132, 255, 0.4);
            z-index: 1000; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="loader"><i data-lucide="shield-check" size="40"></i></div>
    <h2 style="margin-top:20px; letter-spacing:1px;">ALPHABASE</h2>

    <!-- Update Notification -->
    <div id="update-toast" onclick="location.reload()">
        New Update Available! Tap to Refresh
    </div>

    <script>
        lucide.createIcons();

        // Register Service Worker with Update Logic
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            // Display the update toast
                            document.getElementById('update-toast').style.display = 'block';
                        }
                    });
                });
            });
        }

        // Delay redirect to show off the splash screen
        setTimeout(() => {
            window.location.href = 'home.html';
        }, 2500);
    </script>
</body>
</html>

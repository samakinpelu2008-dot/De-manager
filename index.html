<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlphaBase FC</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: #050505;
            margin: 0; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: -apple-system, sans-serif; color: white;
            overflow: hidden;
        }

        .logo-container {
            width: 100px; height: 100px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            color: #0A84FF; margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Subtle glow behind the icon */
        .logo-container::after {
            content: ''; position: absolute;
            width: 50px; height: 50px;
            background: #0A84FF; filter: blur(40px);
            opacity: 0.2; z-index: -1;
        }

        .brand-name { 
            font-weight: 800; font-size: 28px; 
            letter-spacing: -1px; margin-bottom: 8px; 
        }

        .status-text { 
            font-size: 11px; opacity: 0.4; 
            text-transform: uppercase; letter-spacing: 3px; 
            margin-bottom: 40px; height: 15px;
        }

        /* Loading Bar System */
        .progress-track {
            width: 220px; height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px; overflow: hidden;
        }

        .progress-fill {
            width: 0%; height: 100%;
            background: #0A84FF;
            box-shadow: 0 0 15px #0A84FF;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <i data-lucide="shield-check" size="52"></i>
    </div>

    <div class="brand-name">ALPHABASE</div>
    <div class="status-text" id="boot-status">Initializing...</div>

    <div class="progress-track">
        <div class="progress-fill" id="fill"></div>
    </div>

    <script>
        lucide.createIcons();

        const bar = document.getElementById('fill');
        const status = document.getElementById('boot-status');

        // PWA Registration & Progressive Loading
        async function bootSequence() {
            try {
                // Phase 1: Start
                updateProgress(25, "Loading Assets");

                // Phase 2: Service Worker
                if ('serviceWorker' in navigator) {
                    await navigator.serviceWorker.register('sw.js');
                    updateProgress(60, "Syncing Database");
                }

                // Phase 3: Final Optimization
                setTimeout(() => {
                    updateProgress(100, "Welcome Coach");
                    
                    // Final redirect
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 800);
                }, 1000);

            } catch (error) {
                console.error("Boot Error:", error);
                status.innerText = "System Bypass Active";
                setTimeout(() => window.location.href = 'home.html', 2000);
            }
        }

        function updateProgress(amt, text) {
            bar.style.width = amt + "%";
            status.innerText = text;
        }

        window.onload = bootSequence;
    </script>
</body>
</html>

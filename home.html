<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | AlphaBase FC</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
            --blue: #0A84FF;
            --green: #32D74B;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; padding: 20px;
            padding-bottom: 40px;
        }

        /* --- Top Bar --- */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px;
        }

        .profile-section { display: flex; align-items: center; gap: 12px; }
        .avatar { 
            width: 40px; height: 40px; border-radius: 12px; 
            background: linear-gradient(45deg, #0A84FF, #5856D6);
            display: flex; align-items: center; justify-content: center;
        }

        .currency-box {
            background: var(--glass); border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 20px;
            font-weight: 700; color: var(--green); font-size: 14px;
        }

        /* --- Hero: Upcoming Match --- */
        .match-card {
            background: linear-gradient(145deg, rgba(10, 132, 255, 0.15), rgba(0,0,0,0));
            border: 1px solid var(--border);
            border-radius: 28px; padding: 25px; margin-bottom: 25px;
            position: relative; overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .match-card::before {
            content: 'NEXT MATCH';
            position: absolute; top: 15px; right: 20px;
            font-size: 10px; font-weight: 900; opacity: 0.3; letter-spacing: 1px;
        }

        .teams-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .team-box { text-align: center; width: 40%; }
        .team-name { font-size: 18px; font-weight: 800; margin-top: 8px; }
        .vs { font-size: 12px; font-weight: 900; color: var(--blue); opacity: 0.8; }

        .play-btn {
            background: var(--blue); color: white; border: none;
            width: 100%; padding: 14px; border-radius: 16px;
            font-weight: 700; margin-top: 20px; font-size: 15px;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }

        .nav-item {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 24px; padding: 20px;
            display: flex; flex-direction: column; align-items: flex-start;
            gap: 12px; text-decoration: none; color: inherit;
        }

        .nav-item i { color: var(--blue); }
        .nav-title { font-weight: 700; font-size: 15px; }
        .nav-sub { font-size: 11px; opacity: 0.4; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="profile-section">
            <div class="avatar"><i data-lucide="user" size="20"></i></div>
            <div>
                <div style="font-size: 12px; opacity: 0.5;">Head Coach</div>
                <div style="font-weight: 700; font-size: 16px;">Samuel</div>
            </div>
        </div>
        <div class="currency-box">
            <span style="font-size: 10px; opacity: 0.6; color: white; margin-right: 4px;">$</span> 25,400
        </div>
    </div>

    <!-- Hero Match Section -->
    <div class="match-card">
        <div class="teams-row">
            <div class="team-box">
                <i data-lucide="shield" size="32" color="#0A84FF"></i>
                <div class="team-name">ALB</div>
            </div>
            <div class="vs">VS</div>
            <div class="team-box">
                <i data-lucide="shield" size="32" color="#FF453A"></i>
                <div class="team-name">CITY</div>
            </div>
        </div>
        <button class="play-btn" onclick="window.location.href='match.html'">Kick Off</button>
    </div>

    <!-- Navigation Grid -->
    <div class="nav-grid">
        <a href="squad.html" class="nav-item">
            <i data-lucide="layout"></i>
            <div>
                <div class="nav-title">Squad</div>
                <div class="nav-sub">Tactics & Lineup</div>
            </div>
        </a>
        <a href="market.html" class="nav-item">
            <i data-lucide="shopping-cart"></i>
            <div>
                <div class="nav-title">Market</div>
                <div class="nav-sub">Scout Players</div>
            </div>
        </a>
        <a href="training.html" class="nav-item">
            <i data-lucide="dumbbell"></i>
            <div>
                <div class="nav-title">Training</div>
                <div class="nav-sub">Boost Stats</div>
            </div>
        </a>
        <a href="admin.html" class="nav-item">
            <i data-lucide="database"></i>
            <div>
                <div class="nav-title">Admin</div>
                <div class="nav-sub">Manage Data</div>
            </div>
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
